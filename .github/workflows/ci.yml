name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python extensions and SDK
        run: |
          python -m py_compile \
            sdks/python/euler-managed-process-sdk/src/euler_managed_process_sdk/*.py \
            extensions/python-proof/python/extension.py \
            extensions/python-session-summary/python/extension.py \
            extensions/session-run-health/python/extension.py \
            extensions/session-run-health/python/session_run_health/*.py
          python -m json.tool extensions/python-proof/Euler.extension.json >/dev/null
          python -m json.tool extensions/python-session-summary/Euler.extension.json >/dev/null
          python -m json.tool extensions/session-run-health/Euler.extension.json >/dev/null
          python -m unittest discover -s sdks/python/euler-managed-process-sdk/tests -v
          python -m unittest discover -s tests -v
          python -m unittest discover -s extensions/causal-dag/python/tests -v
          python -m unittest discover -s extensions/plan-todo/python/tests -v
          python -m unittest discover -s extensions/session-run-health/python/tests -v
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: SDK and extensions
        run: |
          for crate in sdks/rust/euler-managed-process-sdk extensions/session-export extensions/diagnostics-report extensions/code-swarm extensions/maxproof extensions/autoresearch; do
            echo "== $crate"
            (cd "$crate" \
              && cargo fmt -- --check \
              && cargo clippy --all-targets -- -D warnings \
              && cargo test \
              && cargo build --release)
          done

name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: causal-dag tests
        run: python -m unittest discover -s extensions/causal-dag/python/tests -v
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: SDK and extensions
        run: |
          for crate in sdks/rust/euler-managed-process-sdk extensions/session-export extensions/diagnostics-report extensions/code-swarm extensions/maxproof extensions/autoresearch; do
            echo "== $crate"
            (cd "$crate" \
              && cargo fmt -- --check \
              && cargo clippy --all-targets -- -D warnings \
              && cargo test \
              && cargo build --release)
          done
